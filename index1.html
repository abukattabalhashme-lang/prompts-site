<title>مكتبة برومتات الصور بالذكاء الاصطناعي</title>
<meta name="description" content="مئات برومتات الترند لعمل الصور وتعديلها بالذكاء الاصطناعي. انسخ البرومت وجرّبه فورًا.">
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#1f2430; --muted:#6b7280;
    --primary:#1e5eff; --primary-d:#1648c9; --border:#e3e6ec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:auto;padding:0 14px}

  /* الهيدر */
  header{background:#fff;border-bottom:1px solid var(--border)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;flex-wrap:wrap}
  .logo{font-size:22px;font-weight:800;color:var(--primary);cursor:pointer}
  nav a{margin-inline-start:14px;color:var(--muted);font-size:15px;cursor:pointer}
  nav a:hover{color:var(--primary)}

  /* البانر */
  .hero{background:linear-gradient(135deg,#1e5eff,#6a3df0);color:#fff;text-align:center;padding:38px 14px}
  .hero h1{font-size:26px;margin-bottom:8px}
  .hero p{opacity:.9;margin-bottom:18px}
  .search{max-width:520px;margin:auto}
  .search input{width:100%;padding:13px 16px;border:0;border-radius:10px;font-size:16px;font-family:inherit;outline:none}

  /* التصنيفات */
  .cats{display:flex;gap:8px;flex-wrap:wrap;padding:18px 0 6px}
  .cat{padding:7px 16px;border:1px solid var(--border);background:#fff;border-radius:20px;cursor:pointer;font-size:14px;font-family:inherit}
  .cat.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* الشبكة */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:14px 0 30px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
  .card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .thumb{aspect-ratio:4/5;background:linear-gradient(135deg,#dfe7ff,#efe3ff);display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .card-body{padding:12px}
  .card-body h3{font-size:16px;margin-bottom:6px}
  .tag{display:inline-block;font-size:12px;background:#eef2ff;color:var(--primary);padding:2px 10px;border-radius:12px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}

  /* صفحة البرومت */
  .detail{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin:20px 0}
  .back{display:inline-block;margin:16px 0 0;color:var(--primary);cursor:pointer;font-size:15px}
  .d-wrap{display:grid;grid-template-columns:320px 1fr;gap:20px}
  .d-img{border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#dfe7ff,#efe3ff);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;font-size:60px}
  .d-img img{width:100%;height:100%;object-fit:cover}
  .d-info h2{font-size:22px;margin-bottom:8px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .promptbox{background:#f8f9fb;border:1px dashed #b8c2d6;border-radius:10px;padding:14px;direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .note{background:#fff8e1;border:1px solid #ffe08a;border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:12px}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn{padding:11px 22px;border:0;border-radius:8px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:600}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-d)}
  .btn-light{background:#eef2ff;color:var(--primary)}
  h2.sec{font-size:19px;margin:22px 0 4px}

  /* الصفحات الثابتة */
  .page{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px;margin:20px 0}
  .page h2{margin-bottom:10px}
  .page p{margin-bottom:10px;color:#374151}

  /* الفوتر */
  footer{background:#1f2430;color:#cbd2e0;text-align:center;padding:22px 14px;margin-top:30px;font-size:14px}
  footer a{margin:0 10px;cursor:pointer;color:#fff}

  /* رسالة النسخ */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;padding:10px 22px;border-radius:24px;font-size:15px;transition:.3s;z-index:100000;opacity:0}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  @media(max-width:700px){
    .d-wrap{grid-template-columns:1fr}
    .hero h1{font-size:21px}
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .card-body h3{font-size:14px}
  }
</style>
</head>

/* =====================================================
   كود الموقع
   ===================================================== */
const app = document.getElementById("app");
const toastEl = document.getElementById("toast");
document.getElementById("yr").textContent = new Date().getFullYear();
let currentCat = "الكل", query = "";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove("show"),1800)}

function copyText(text,msg){
  const done=()=>toast(msg||"تم النسخ ✓");
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done()}catch(e){toast("تعذّر النسخ")}
    ta.remove();
  }
}

function goHome(){location.hash="";}
function goPage(n){location.hash="#page/"+n;}
function openPrompt(slug){location.hash="#p/"+slug;}

function thumb(p,cls){
  return p.image ? `<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">` : "🎨";
}

/* الصفحة الرئيسية */
function renderHome(){
  document.title="مكتبة برومتات الصور بالذكاء الاصطناعي";
  const cats=["الكل",...new Set(PROMPTS.map(p=>p.category).filter(Boolean))];
  const q=query.trim().toLowerCase();
  const list=PROMPTS.filter(p=>
    (currentCat==="الكل"||p.category===currentCat) &&
    (!q||(p.title+" "+p.prompt+" "+(p.category||"")).toLowerCase().includes(q))
  );

  app.innerHTML=`
    <section class="hero">
      <h1>برومتات الترند لعمل الصور وتعديلها بالذكاء الاصطناعي</h1>
      <p>اختر البرومت، انسخه، وجرّبه في أداتك المفضلة</p>
      <div class="search"><input id="q" type="search" placeholder="ابحث عن برومت... (مثال: أنمي، منتج، بورتريه)" value="${esc(query)}"></div>
    </section>
    <div class="wrap">
      <div class="cats">${cats.map(c=>`<button class="cat ${c===currentCat?"active":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      ${list.length?`<div class="grid">${list.map(p=>`
        <div class="card" onclick="openPrompt('${esc(p.slug)}')">
          <div class="thumb">${thumb(p)}</div>
          <div class="card-body"><h3>${esc(p.title)}</h3><span class="tag">${esc(p.category||"")}</span></div>
        </div>`).join("")}</div>`
      :`<div class="empty">${PROMPTS.length?"لا توجد نتائج مطابقة":"لم تُضف أي برومتات بعد"}</div>`}
    </div>`;

  const qi=document.getElementById("q");
  qi.addEventListener("input",e=>{
    query=e.target.value;
    const pos=e.target.selectionStart;
    renderHome();
    const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos);
  });
  app.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{currentCat=b.dataset.c;renderHome()});
}

/* صفحة البرومت */
function renderPrompt(slug){
  const p=PROMPTS.find(x=>x.slug===slug);
  if(!p){app.innerHTML=`<div class="wrap"><div class="empty">البرومت غير موجود</div><div style="text-align:center"><a class="back" onclick="goHome()">← الرجوع للرئيسية</a></div></div>`;return;}
  document.title=p.title+" | مكتبة البرومتات";
  const related=PROMPTS.filter(x=>x.slug!==p.slug&&x.category===p.category).slice(0,4);
  const link=location.origin+location.pathname+"#p/"+p.slug;

  app.innerHTML=`
    <div class="wrap">
      <a class="back" onclick="goHome()">→ الرجوع للرئيسية</a>
      <div class="detail">
        <div class="d-wrap">
          <div class="d-img">${thumb(p)}</div>
          <div class="d-info">
            <h2>${esc(p.title)}</h2>
            <div class="meta">
              <span class="tag">${esc(p.category||"")}</span>
              ${p.tool?`<span class="tag">🛠 ${esc(p.tool)}</span>`:""}
            </div>
            ${p.photo?`<div class="note">📷 هذا البرومت يحتاج ترفع صورتك مع البرومت في الأداة.</div>`:""}
            <div class="promptbox" id="ptxt">${esc(p.prompt)}</div>
            <div class="btns">
              <button class="btn btn-primary" id="cp">📋 نسخ البرومت</button>
              <button class="btn btn-light" id="cl">🔗 نسخ الرابط</button>
            </div>
          </div>
        </div>
      </div>
      ${related.length?`<h2 class="sec">برومتات مشابهة</h2><div class="grid">${related.map(r=>`
        <div class="card" onclick="openPrompt('${esc(r.slug)}')">
          <div class="thumb">${thumb(r)}</div>
          <div class="card-body"><h3>${esc(r.title)}</h3><span class="tag">${esc(r.category||"")}</span></div>
        </div>`).join("")}</div>`:""}
    </div>`;

  document.getElementById("cp").onclick=()=>copyText(p.prompt,"تم نسخ البرومت ✓");
  document.getElementById("cl").onclick=()=>copyText(link,"تم نسخ الرابط ✓");
  window.scrollTo(0,0);
}

/* الصفحات الثابتة */
function renderPage(n){
  const pg=PAGES[n];
  if(!pg){goHome();return;}
  document.title=pg.t+" | مكتبة البرومتات";
  app.innerHTML=`<div class="wrap"><div class="page"><h2>${esc(pg.t)}</h2>${pg.b.map(x=>`<p>${esc(x)}</p>`).join("")}</div></div>`;
  window.scrollTo(0,0);
}

/* التوجيه */
function route(){
  const h=location.hash.replace(/^#/,"");
  if(h.startsWith("p/")) renderPrompt(decodeURIComponent(h.slice(2)));
  else if(h.startsWith("page/")) renderPage(h.slice(5));
  else {renderHome();}
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
